apply plugin: 'com.android.application'
apply plugin: 'io.github.wurensen.android-aspectjx'
apply from: '../common.gradle'

aspectjx {
    include 'com.hjq.demo', 'com.anfu.offline.pay.demo.test'
    exclude 'androidx', 'com.google', 'com.blankj', 'com.huawei', 'org.apache', 'com.wushaohong.zxing', 'com.szanfu', 'com.jakewharton'
}

// One timestamp per build. Used for BOTH the APK filename and the BUILD_TIME
// shown in the app, so the stamp on screen always identifies the installed APK.
def buildStamp = new Date().format("yyyyMMddHHmm")

// Android 代码规范文档：https://github.com/getActivity/AndroidCodeStandard
android {

    // 资源目录存放指引：https://developer.android.google.cn/guide/topics/resources/providing-resources
    defaultConfig {

        // 无痛修改包名：https://www.jianshu.com/p/17327e191d2e
        applicationId 'com.anfu.offline.pay.demo.test'
        // Bump BOTH on every release build. versionCode is what Android uses to
        // decide an install is an upgrade; versionName is what the terminal
        // prints on slips and shows in the admin panel.
        //
        // 1.1.0 - full settlement (0500/0320/trailer), PAX-style settlement and
        //         void screens, DE14 sent for every card brand, card masking and
        //         debug parameters.
        // 1.1.1 - settlement and void no longer show the card-reader screen,
        //         detail report and settlement slip print as one bitmap (they
        //         were racing and overprinting), Back works after settlement,
        //         void slip shows the amount instead of "TK null", slip totals
        //         use fixed monospace columns.
        // 1.1.2 - host-approved / card-declined transactions are now reversed
        //         (they were left in the batch to be settled while the slip
        //         said DECLINED), and the GAC2 failure reason is recorded.
        // 1.1.3 - CA public keys now load from assets/capk.json (78 keys, the
        //         same table PAX uses). The built-in list lacked Mastercard
        //         index 06, so those cards failed offline data authentication
        //         and declined at GAC2 after the issuer approved.
        // 1.1.4 - card range validation from assets/card_range.json (the PAX
        //         table): a card outside the accepted BIN ranges is refused at
        //         the terminal with "CARD NOT SUPPORTED" instead of being sent
        //         to the host. American Express AID removed - DBBL do not
        //         acquire Amex.
        // 1.2.0 - TakaPay and NexusPay support: AIDs, CA public keys and BIN
        //         ranges. Card Range is now an editable parameter, and the
        //         range name prints on the slip.
        // 1.2.1 - card range names are editable in place, not only at add time.
        // 1.3.0 - PIN pad redesigned to the PAX layout; a failed card read now
        //         re-arms and asks for the card again instead of cancelling the
        //         transaction; slip text prints genuinely bold.
        // 1.3.1 - PIN Pad parameter: STATIC (1-2-3 order) or DYNAMIC (keys
        //         shuffled on every entry).
        // 1.4.0 - admin panel rebuilt in the PAX settings design: a white list
        //         of rows with values and switches, hairline dividers and
        //         grouped sections, instead of stacked buttons.
        // 1.5.0 - Reports menu matching PAX: last transaction (merchant or
        //         customer copy), reprint by invoice, detail report, card
        //         issuer report, last settlement and error TRXN report.
        // 1.6.0 - EMI: sale with tenure selection, EMI void, EMI report, package
        //         download (MTI 1304) or manual entry, and PAX's EMI parameters
        //         including the twenty tenure controls.
        // 1.6.1 - EMI void actually routes to the EMI host (it was going out on
        //         the acquirer NII), and no longer writes the EMI NII into the
        //         saved configuration to do it.
        // 1.7.0 - EMI void corrected to the ordinary void packet and NII (what
        //         PAX does - ZipVoidTrans extends SaleVoidTrans); Menu Hide and
        //         Transaction Control for every menu item; EMI as its own row
        //         on the settlement slip while still inside the DE63 sale
        //         totals.
        // 1.7.1 - EMI plans are configured in the admin panel only; the host
        //         package download (MTI 1304) is removed, DBBL do not serve it.
        // 1.8.0 - Clear menu: Batch Clear, Reversal Clear, Pre-Auth Clear and
        //         Error Log Clear, each stating what it destroys first.
        // 1.8.1 - admin status panel no longer truncates key injection reports;
        //         host failures name the ip:port and the exception; the request
        //         dump shows which host was addressed.
        // 1.9.0 - Pre-Auth, Pre-Auth Void and Sale Completion, matched to a
        //         Move/2500 capture: 0100 with DE3 300000 and DE25 06, then an
        //         0400 that repeats the authorisation's own STAN, RRN and
        //         approval code. EMI carries the plan in DE61 rather than DE48,
        //         and the EMI and pre-auth slips print no tip line. New PIN pad
        //         sized against the display instead of dp, with the pad's key
        //         rectangles verified before the SDK is armed and the entry
        //         timeout owned by the app. FindCardActivity no longer fires a
        //         synthetic touch over the PIN pad. A host decline shows the
        //         issuer's response code instead of blaming the card.
        // 2.0.0 - SDK interface updated to AFSDKInterface V0.0.356. DE22 rebuilt
        //         as two-digit entry codes: fallback was going out as 0081 and
        //         DBBL's own reference terminal sends 0801, and contactless is
        //         071 rather than the 0910 that was being refused with response
        //         57. Magstripe fallback is now reachable at all - the flag was
        //         pinned off - and fires after three failed chip reads, counted
        //         at the one point every failed read passes through. EMI card
        //         ranges get their own table in the parameters and fail closed:
        //         no range, no EMI. A card-declined reversal is delivered
        //         immediately and retried to a configurable limit instead of
        //         waiting for the next transaction, and an unacknowledged one
        //         is shown on the home screen. Cancel on the PIN pad now stops
        //         the online send outright. The PIN box row reads the pad's
        //         reported LENGTH, which is what clickPinPadResult actually
        //         carries, so CLEAR removes one digit. Inserting a card on the
        //         idle screen opens the amount keypad, and a transaction chosen
        //         from a tile always wins over it. Admin panel resized against
        //         the display, blue theme, a header on every page, ENTRY MODE
        //         controls and a new password entry screen.
        // 2.0.12 - card screen never waits on a stale search: search timeout
        //         fixed to seconds (5 s slices, re-armed quietly), prompt shown
        //         at once, idle home search cut to 1 s. Chip card number is
        //         confirmed inside the kernel, so CANCEL there no longer leaves
        //         the kernel waiting (no Secure Pinpad popup, no app restart).
        //         A chip pulled out ends the sale with CARD REMOVED. No slot
        //         polling during the search, so contactless reads faster.
        // 2.0.13 - no system "Secure Pinpad" after a cancel: the range, EMI and
        //          expiry checks run at the card confirm (the kernel ends cleanly),
        //          the kernel PIN wait is freed with skipShowPinPad (no pad on
        //          screen), and the custom pad never falls back once the sale
        //          ended. Faster chip read: home search closed before arming,
        //          kernel timer callback no longer logs; CARDTIME timing lines.
        // 2.0.14 - card screen reads at once: the home screen no longer keeps an
        //          11 s chip search open (the SDK raises 1 s to 10 s and close
        //          does not end it); it probes the slot instead. Slip printing
        //          can no longer crash the app (plain record printed, error
        //          logged). Sale Completion amount screen starts at 0.00.
        // 2.0.15 - slips print in short jobs (a long job lost its last ~360 rows,
        //          so with Debug OFF the pre-auth slip came out half). Pre Auth
        //          Percentage parameter (default 125%) caps Sale Completion.
        //          Completion slip: no TIP/TOTAL, SIGN line under the amount.
        //          Card number printed twice the size, bold, on every slip.
        //          "Preparing card reader" spinner until the reader is armed.
        // 2.0.16 - slips print as ONE smooth job again, with a blank leader in
        //          front (the part the printer drops); card number and entry mode
        //          back on one line, bold, size 26; NO CVM REQUIRED not printed.
        // 2.0.17 - BACK / CANCEL never shows TRANSACTION CANCELLED on an approved
        //          transaction: ignored while with the host or printing, and on
        //          the result screen it just returns home.
        // 2.0.18 - no blank leader before slips (it printed as blank paper);
        //          slips still print as one smooth job.
        // 2.0.19 - two extra blank lines under every printed slip so the last
        //          line is not torn off.
        versionCode 43
        versionName "2.0.19"
        testInstrumentationRunner 'com.hjq.demo.QrPreviewInstrumentation'

        // 仅保留中文语种的资源
        //resConfigs 'zh'

        // 仅保留 xxhdpi 图片资源（目前主流分辨率 1920 * 1080）
        //resConfigs 'xxhdpi'

        // 混淆配置
        proguardFiles 'proguard-sdk.pro', 'proguard-app.pro'

        // 日志打印开关
        buildConfigField('boolean', 'LOG_ENABLE', '' + LOG_ENABLE + '')
        // 测试包下的 BuglyId
        buildConfigField('String', 'BUGLY_ID', '"' + BUGLY_ID + '"')
        // 测试服务器的主机地址
        buildConfigField('String', 'HOST_URL', '"' + HOST_URL + '"')
        // Build stamp, matches the timestamp in the APK filename. Shown in the
        // admin panel and on slips so it is obvious which build is installed.
        buildConfigField('String', 'BUILD_TIME', '"' + buildStamp + '"')
    }

    // Apk 签名的那些事：https://www.jianshu.com/p/a1f8e5896aa2
    testOptions { unitTests.returnDefaultValues = true }

    signingConfigs {
        config {
            storeFile file(StoreFile)
            storePassword StorePassword
            keyAlias KeyAlias
            keyPassword KeyPassword
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }
    packagingOptions {
        jniLibs {
            excludes += ['META-INF/*******']
        }
        resources {
            excludes += ['META-INF/*******']
        }
    }

    // 构建配置：https://developer.android.google.cn/studio/build/build-variants
    buildTypes {

        debug {
            // 给包名添加后缀
            applicationIdSuffix ''
            // 调试模式开关
            debuggable true
            jniDebuggable true
            // 压缩对齐开关
            zipAlignEnabled false
            // 移除无用的资源
            shrinkResources false
            // 代码混淆开关
            minifyEnabled false
            // 签名信息配置
            signingConfig signingConfigs.config
            // 添加清单占位符
            addManifestPlaceholders([
//                    'app_name': 'OffLine PAY'
                    'app_name': '@string/app_name'
            ])
            // 调试模式下只保留一种架构的 so 库，提升打包速度
            ndk {
                abiFilters(project.hasProperty('uiPreview') ? 'x86_64' : 'armeabi-v7a')
            }
        }

        preview.initWith(debug)
        preview {
            applicationIdSuffix ''
            // 添加清单占位符
            addManifestPlaceholders([
//                    'app_name': 'OffLine Preview '
'app_name': '@string/app_name'
            ])
        }

        release {
            // 调试模式开关
            debuggable false
            jniDebuggable false
            // 压缩对齐开关
            zipAlignEnabled true
            // 移除无用的资源
            shrinkResources true
            // 代码混淆开关
            minifyEnabled true
            // 签名信息配置
            signingConfig signingConfigs.config
            // 添加清单占位符
            addManifestPlaceholders([
                    'app_name': '@string/app_name'
            ])
            // 仅保留两种架构的 so 库，根据 Bugly 统计得出
            ndk {
                // armeabi：万金油架构平台（占用率：0%）
                // armeabi-v7a：曾经主流的架构平台（占用率：10%）
                // arm64-v8a：目前主流架构平台（占用率：95%）
                abiFilters 'armeabi-v7a', 'arm64-v8a'
            }
        }
    }


    // AOP 配置（exclude 和 include 二选一）
    // 需要进行配置，否则就会引发冲突，具体表现为：
    // 第一种：编译不过去，报错：java.util.zip.ZipException：Cause: zip file is empty
    // 第二种：编译能过去，但运行时报错：ClassNotFoundException: Didn't find class on path: DexPathList
    aspectjx {
        // 排除一些第三方库的包名（Gson、 LeakCanary 和 AOP 有冲突）
        // exclude 'androidx', 'com.google', 'com.squareup', 'org.apache', 'com.alipay', 'com.taobao', 'versions.9'
        // 只对以下包名做 AOP 处理
        include android.defaultConfig.applicationId
    }

//    applicationVariants.all { variant ->
//        // apk 输出文件名配置
//        variant.outputs.all { output ->
//            outputFileName = rootProject.getName() + '_v' + variant.versionName + '_' + variant.buildType.name
//            if (variant.buildType.name == buildTypes.release.getName()) {
//                outputFileName += '_' + new Date().format('MMdd')
//            }
//            outputFileName += '.apk'
//        }
//    }

    def mappingFileArray = []
    applicationVariants.all { variant ->
        def buildTypeName = variant.buildType.name
        variant.outputs.all { output ->
            // DBBL-POS_v1.1.0_debug_202608101530.apk - the trailing timestamp is
            // the same value as BuildConfig.BUILD_TIME shown inside the app.
            outputFileName = "DBBL-POS_v" + variant.versionName + "_" + buildTypeName + (project.hasProperty('uiPreview') ? "_EMULATOR_ONLY" : "") + "_" + buildStamp + ".apk"
            if ("release" == buildTypeName) {
                mappingFileArray.add("${buildDir}/outputs/mapping/release/mapping.txt")
            }
        }
    }

}

// 添加构建依赖项：https://developer.android.google.cn/studio/build/dependencies
// api 与 implementation 的区别：https://www.jianshu.com/p/8962d6ba936e
dependencies {
    configurations.all {
        resolutionStrategy.eachDependency {
            DependencyResolveDetails details ->
                def requested = details.requested
                if (requested.group == "androidx.appcompat") {
                    if (requested.name == "appcompat") {
                        details.useVersion "1.3.1"
                    }
                }
        }
    }
    // 基类封装
    implementation project(':library:base')
    // 控件封装
    implementation project(':library:widget')
    // 友盟封装
    implementation project(':library:umeng')

    // 权限请求框架：https://github.com/getActivity/XXPermissions
    implementation 'com.github.getActivity:XXPermissions:20.0'


    // 标题栏框架：https://github.com/getActivity/TitleBar
    implementation 'com.github.getActivity:TitleBar:9.2'

    // 吐司框架：https://github.com/getActivity/ToastUtils
    implementation 'com.github.getActivity:ToastUtils:9.5'

    // 网络请求框架：https://github.com/getActivity/EasyHttp
    implementation 'com.github.getActivity:EasyHttp:10.2'
    // OkHttp 框架：https://github.com/square/okhttp
    // noinspection GradleDependency
    implementation('com.squareup.retrofit2:retrofit:2.4.0') { exclude group: 'com.squareup.okhttp3' }
    implementation('com.squareup.retrofit2:converter-gson:2.4.0') { exclude group: 'com.squareup.okhttp3' }
    implementation 'com.squareup.okhttp3:okhttp:3.7.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:3.7.0'
    implementation 'com.squareup.retrofit2:converter-scalars:2.0.0'
    //rxJava
    implementation 'io.reactivex.rxjava2:rxandroid:2.0.1'
    implementation 'io.reactivex.rxjava2:rxjava:2.1.5'
    // Json 解析框架：https://github.com/google/gson
    implementation 'com.google.code.gson:gson:2.8.8'
    // Gson 解析容错：https://github.com/getActivity/GsonFactory
    implementation 'com.github.getActivity:GsonFactory:5.2'

    // Shape 框架：https://github.com/getActivity/ShapeView
    implementation 'com.github.getActivity:ShapeView:6.0'

    // AOP 插件库：https://mvnrepository.com/artifact/org.aspectj/aspectjrt
    implementation 'org.aspectj:aspectjrt:1.9.6'

    // 图片加载框架：https://github.com/bumptech/glide
    // 官方使用文档：https://github.com/Muyangmin/glide-docs-cn
    implementation 'com.github.bumptech.glide:glide:4.12.0'
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
    implementation project(path: ':zxing')
    annotationProcessor 'com.github.bumptech.glide:compiler:4.12.0'

    // 沉浸式框架：https://github.com/gyf-dev/ImmersionBar
    implementation 'com.gyf.immersionbar:immersionbar:3.0.0'

    // 手势 ImageView：https://github.com/Baseflow/PhotoView
    implementation 'com.github.Baseflow:PhotoView:2.3.0'

    // Bugly 异常捕捉：https://bugly.qq.com/docs/user-guide/instruction-manual-android/?v=20190418140644
    implementation 'com.tencent.bugly:crashreport:3.4.4'
    implementation 'com.tencent.bugly:nativecrashreport:3.9.2'

    // 动画解析库：https://github.com/airbnb/lottie-android
    // 动画资源：https://lottiefiles.com、https://icons8.com/animated-icons
    implementation 'com.airbnb.android:lottie:6.0.0'

    // 上拉刷新下拉加载框架：https://github.com/scwang90/SmartRefreshLayout
    implementation 'com.scwang.smart:refresh-layout-kernel:2.0.3'
    implementation 'com.scwang.smart:refresh-header-material:2.0.3'

    // 日志打印框架：https://github.com/JakeWharton/timber
    implementation 'com.jakewharton.timber:timber:4.7.1'

    // 指示器框架：https://github.com/ongakuer/CircleIndicator
    implementation 'me.relex:circleindicator:2.1.6'

    // 腾讯 MMKV：https://github.com/Tencent/MMKV
    implementation 'com.tencent:mmkv-static:1.2.10'

    // 内存泄漏监测框架：https://github.com/square/leakcanary
    //debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.7'
    //previewImplementation 'com.squareup.leakcanary:leakcanary-android:2.7'
    //语种切换框架
    implementation 'com.github.getActivity:MultiLanguages:8.0'
    // 多语种：https://github.com/getActivity/MultiLanguages
    // 悬浮窗：https://github.com/getActivity/XToast
    // 日志输出：https://github.com/getActivity/Logcat
    // 工具类：https://github.com/Blankj/AndroidUtilCode
    // 轮播图：https://github.com/bingoogolapple/BGABanner-Android
    // 二维码：https://github.com/bingoogolapple/BGAQRCode-Android
    // 跑马灯：https://github.com/sunfusheng/MarqueeView
    // 对象注解：https://www.jianshu.com/p/f1f888e4a35f
    // 对象存储：https://github.com/leavesC/DoKV
    // 多渠道打包：https://github.com/Meituan-Dianping/walle
    // 设备唯一标识：http://msa-alliance.cn/col.jsp?id=120
    // 嵌套滚动容器：https://github.com/donkingliang/ConsecutiveScroller
    // 隐私调用监控：https://github.com/huage2580/PermissionMonitor

    implementation 'org.apache.commons:commons-lang3:3.12.0'


    implementation 'org.litepal.guolindev:core:3.2.3'

    // Offline speech recognition (Vosk) - free, Apache-2.0, works without Google services
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
    implementation 'com.alphacephei:vosk-android:0.3.47'
    implementation 'androidx.appcompat:appcompat:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'com.tonystark.android:socket:latest.release'
    implementation 'com.tonystark.android:socket-server:latest.release'
    // https://mvnrepository.com/artifact/org.apache.commons/commons-lang3
    implementation group: 'org.apache.commons', name: 'commons-lang3', version: '3.0'
    implementation 'com.blankj:utilcodex:1.31.1'

    //implementation 'cn.yipianfengye.android:zxing-library:2.2'
    //implementation 'com.github.bingoogolapple.BGAQRCode-Android:zbar:1.3.8'
    //   huawei saoma
    implementation 'com.huawei.hms:scanplus:2.12.0.300'

    // 相机相关依赖
    implementation 'androidx.camera:camera-camera2:1.1.0'
    implementation 'androidx.camera:camera-lifecycle:1.1.0'
    implementation 'androidx.camera:camera-view:1.1.0-beta02'

    // MLKit Barcode Scanning依赖
    implementation 'com.google.mlkit:barcode-scanning:17.2.0'

    // 工具类库
    implementation 'com.blankj:utilcodex:1.31.1'

    //动态权限获取(权限简单获取)
    implementation 'pub.devrel:easypermissions:3.0.0'

    implementation 'com.google.android.gms:play-services-base:18.0.0'


    implementation 'com.google.android.gms:play-services-location:21.0.1'

    implementation 'org.greenrobot:eventbus:3.2.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'com.squareup.okhttp3:okhttp:3.12.13'
    androidTestImplementation 'com.squareup.okio:okio:1.17.4'
}
